<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Daftar - KAI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
      body {
        background-image: url('background.jpg');
        background-size: cover;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }
      .card-register{max-width:520px;width:100%}
      @media (max-width:480px){body{padding:12px}}
    </style>
  </head>
  <body class="d-flex justify-content-center align-items-center">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

    <div class="container card-register">
      <div class="row justify-content-center">
        <div class="col-12">
          <div class="card">
            <div class="card-header text-center bg-primary text-white">
              <h3 class="mb-0">Daftar - KAI</h3>
            </div>
            <div class="card-body">
              <p class="text-muted">Buat akun untuk memesan tiket kereta dengan cepat.</p>

              <div id="msg" aria-live="polite"></div>

              <form id="registerForm" method="post" action="http://localhost:8000/register.php" novalidate>
                <div class="mb-3">
                  <label for="full_name" class="form-label">Nama Lengkap</label>
                  <input id="full_name" name="full_name" type="text" class="form-control" placeholder="Nama lengkap" required>
                </div>

                <div class="mb-3">
                  <label for="nip" class="form-label">NIP</label>
                  <input id="nip" name="nip" type="text" class="form-control" placeholder="NIP (hanya angka, minimal 6 digit)" required>
                </div>

                <!-- Username removed per request: only Nama Lengkap and NIK remain -->

                <div class="mb-3">
                  <label for="password" class="form-label">Password</label>
                  <input id="password" name="password" type="password" class="form-control" placeholder="Minimal 6 karakter" required>
                </div>

                <div class="mb-3 text-muted small">Dengan mendaftar, Anda menyetujui Syarat &amp; Ketentuan kami.</div>

                <div class="d-grid">
                  <button type="submit" class="btn btn-primary" id="submitBtn">Daftar</button>
                </div>
              </form>
            </div>
            <div class="card-footer text-center">
              <small class="text-muted">Sudah punya akun? <a href="HTML_login.html" class="link-primary">Masuk</a></small>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      // Simple client-side validation saja
      document.getElementById('registerForm').addEventListener('submit', function(e) {
        const fullName = document.getElementById('full_name').value.trim();
        const nip = document.getElementById('nip').value.trim();
        const password = document.getElementById('password').value;
        
        if (fullName.length < 2) {
          e.preventDefault();
          alert('Nama harus minimal 2 karakter');
          return;
        }
        if (!/^\d{6,20}$/.test(nip)) {
          e.preventDefault();
          alert('NIP harus angka 6-20 digit');
          return;
        }
        if (password.length < 6) {
          e.preventDefault();
          alert('Password harus minimal 6 karakter');
          return;
        }
        // Jika valid, form benar-benar submit
      });
    </script>
  </body>
</html>
