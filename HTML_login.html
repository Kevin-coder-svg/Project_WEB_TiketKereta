<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>KAI-Kaki Anak Itam</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
      body {
        background-image: url('background.jpg');
        background-size: cover;
        height: 100vh;
      }
    </style>
  </head>
  <body class="d-flex justify-content-center align-items-center">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <div id="page" class="container-fluid">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-8">
                    <div class="card">
                        <div class="card-header text-center bg-primary text-white">
                        <h3>KAI - Kaki Anak Itam</h3>
                        </div>
                        <div class="card-body">
                        <div id="msg" class="mb-3"></div>
                        <form id="loginForm" method="post" action="login.php" novalidate>
                          <div class="mb-3">
                          <label for="email" class="form-label">Email</label>
                          <input type="email" class="form-control" id="email" name="email" placeholder="Masukkan email Anda" required>
                          </div>
                            <div class="mb-3">
                            <label for="password" class="form-label">Password</label>
                            <input type="password" class="form-control" id="password" name="password" placeholder="Masukkan password Anda" required>
                            </div>
                            <div class="mb-3">
                            <label for="role" class="form-label">Role</label>
                            <select class="form-select" id="role" name="role" required>
                              <option value="user">User</option>
                              <option value="admin">Admin</option>
                            </select>
                            </div>
                            <div class="d-grid">
                            <button type="submit" class="btn btn-primary">Login</button>
                            </div>
                        </form>
                        </div>
                        <div class="text-center mb-4">
                          <a href="register.html" class="link-primary">Register/Daftar</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
      document.getElementById('loginForm').addEventListener('submit', function(event) {
        event.preventDefault(); // Prevent form submission

        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const role = document.getElementById('role').value;

        // Send login data to the server
        fetch('login.php', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/x-www-form-urlencoded',
          },
          body: new URLSearchParams({ email, password, role }),
        })
          .then(response => response.json())
          .then(data => {
            if (data.success) {
              if (data.role === 'admin') {
                window.location.href = 'admin.php';
              } else {
                window.location.href = 'home.html';
              }
            } else {
              alert(data.message); // Show error message in a popup
            }
          })
          .catch(error => {
            console.error('Error:', error);
            alert('Terjadi kesalahan. Silakan coba lagi.');
          });
      });
    </script>
  </body>
</html>
